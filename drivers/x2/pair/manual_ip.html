<fieldset>
  <legend>SofaBaton X2</legend>

  <div class="field-row">
    <label for="ip">X2 IP address</label>
    <input id="ip" type="text" placeholder="192.168.1.50" />
  </div>

  <p>MQTT is optional. Add it later in the device settings if you want physical X2 button presses to trigger Homey Flows.</p>
</fieldset>

<button id="connect" class="homey-button-primary-full">Connect</button>

<p id="status" style="min-height:1.4em;"></p>

<script>
document.getElementById('connect').addEventListener('click', async () => {
  const status = document.getElementById('status');
  const ip = document.getElementById('ip').value.trim();

  if (!ip) {
    status.textContent = 'Please enter an IP address.';
    return;
  }

  status.textContent = 'Connecting…';
  document.getElementById('connect').disabled = true;

  try {
    const result = await Homey.emit('validate_ip', { ip });
    if (result === true) {
      await Homey.nextView();
    } else {
      status.textContent = 'Could not connect. Check the IP address and try again.';
      document.getElementById('connect').disabled = false;
    }
  } catch (err) {
    status.textContent = (err && err.message) ? err.message : 'Connection failed. Check the IP address and try again.';
    document.getElementById('connect').disabled = false;
  }
});
</script>
